name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Parse Pi extension
        run: node --experimental-strip-types --check extensions/pi/index.ts
      - name: Parse publish helper
        run: bash -n scripts/publish_github.sh
      - name: Validate benchmark example
        run: |
          python benchmark/scripts/validate.py \
            benchmark/examples/run-records.jsonl \
            --manifest benchmark/examples/task-manifest.json \
            --artifact-root benchmark/examples \
            --require-complete \
            --require-artifacts
      - name: Analyze benchmark example
        run: |
          python benchmark/scripts/analyze.py \
            benchmark/examples/run-records.jsonl \
            --manifest benchmark/examples/task-manifest.json \
            --output /tmp/report.md
      - name: Smoke-test experiment scaffolder
        run: |
          python benchmark/scripts/init_experiment.py \
            /tmp/mero-precision-smoke \
            --experiment-id smoke-001 \
            --tasks 4 \
            --replicates 2 \
            --seed 42
          test -f /tmp/mero-precision-smoke/manifest.json
