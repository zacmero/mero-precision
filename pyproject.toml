[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mero-precision"
version = "0.1.0"
description = "Precision-first communication and selective completion enforcement for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zac Mero" }]
keywords = ["agents", "coding-agents", "prompt-engineering", "agent-skills", "hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
mero-precision-gate = "mero_precision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
